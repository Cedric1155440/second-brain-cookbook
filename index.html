<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Second Brain Cookbook</title>
<!-- Web-App / iPhone Home-Bildschirm -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Second Brain">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#faf6ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1916" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf6ef;
    --surface: #ffffff;
    --surface-2: #f3ece0;
    --text: #2b2420;
    --muted: #7a6d62;
    --line: #e6dccd;
    --accent: #c0532b;
    --accent-soft: #f7e1d5;
    --ok: #3d7a4a;
    --ok-soft: #e1f0e3;
    --warn: #a86b12;
    --warn-soft: #f8ebd2;
    --shadow: 0 1px 2px rgba(60,40,20,.06), 0 4px 16px rgba(60,40,20,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1916; --surface: #262220; --surface-2: #302a26; --text: #f1e9df; --muted: #a8998b;
      --line: #3d3530; --accent: #e9845c; --accent-soft: #46291d; --ok: #7cc48a; --ok-soft: #1f3424;
      --warn: #e2b05a; --warn-soft: #3d2f17; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1916; --surface: #262220; --surface-2: #302a26; --text: #f1e9df; --muted: #a8998b;
    --line: #3d3530; --accent: #e9845c; --accent-soft: #46291d; --ok: #7cc48a; --ok-soft: #1f3424;
    --warn: #e2b05a; --warn-soft: #3d2f17; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  }
  * { box-sizing: border-box; }
  html { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }
  body { transition: background .2s, color .2s; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 Inter, system-ui, sans-serif; }
  h1, h2, h3 { font-family: Fraunces, Georgia, serif; font-weight: 700; margin: 0; letter-spacing: -.01em; }
  button { font: inherit; cursor: pointer; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 28px 16px 64px; }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
  header h1 { font-size: clamp(28px, 5vw, 40px); }
  header p { margin: 4px 0 0; color: var(--muted); }
  .layout { display: grid; grid-template-columns: 360px 1fr; gap: 24px; align-items: start; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; box-shadow: var(--shadow); }
  .side { position: sticky; top: 16px; }
  @media (max-width: 860px) { .side { position: static; } }
  .panel h2 { font-size: 20px; margin-bottom: 12px; }
  .addrow { display: flex; gap: 8px; }
  .addrow input { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; }
  .addrow input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .btn { padding: 10px 14px; border-radius: 10px; border: 1px solid transparent; background: var(--accent); color: #fff; font-weight: 600; }
  .btn.ghost { background: transparent; color: var(--text); border-color: var(--line); }
  .btn.small { padding: 6px 10px; font-size: 13px; }
  .hint { color: var(--muted); font-size: 13px; margin: 8px 0 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 4px; min-height: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 6px 5px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--text); font-size: 13px; font-weight: 500; }
  .chip button { border: 0; background: transparent; color: var(--muted); width: 20px; height: 20px; border-radius: 50%; line-height: 1; padding: 0; font-size: 15px; }
  .chip button:hover { background: rgba(0,0,0,.08); color: var(--text); }
  .chip.unknown { background: var(--surface-2); border: 1px dashed var(--line); }
  .empty-pantry { color: var(--muted); font-size: 13px; font-style: italic; }
  details.group { border-top: 1px solid var(--line); padding: 8px 0; }
  details.group summary { cursor: pointer; font-weight: 600; font-size: 14px; list-style: none; display: flex; justify-content: space-between; }
  details.group summary::-webkit-details-marker { display: none; }
  details.group summary::after { content: "+"; color: var(--muted); }
  details.group[open] summary::after { content: "−"; }
  .quick { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 8px; }
  .quick button { border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 999px; padding: 4px 10px; font-size: 13px; }
  .quick button.on { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); font-weight: 600; }
  .basics { font-size: 13px; color: var(--muted); background: var(--surface-2); border-radius: 10px; padding: 8px 10px; margin-top: 12px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
  .seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; flex-wrap: wrap; }
  .seg button { border: 0; background: transparent; color: var(--muted); padding: 6px 10px; border-radius: 7px; font-size: 13px; font-weight: 500; }
  .seg button.on { background: var(--accent); color: #fff; }
  select { padding: 7px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font: inherit; font-size: 13px; }
  .section-title { display: flex; align-items: baseline; gap: 10px; margin: 8px 0 12px; }
  .section-title h2 { font-size: 22px; }
  .section-title span { color: var(--muted); font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; margin-bottom: 28px; }
  .card { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); color: var(--text); display: flex; flex-direction: column; gap: 8px; transition: transform .12s, border-color .12s; }
  .card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .card .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .card .emoji { font-size: 30px; line-height: 1; }
  .card h3 { font-size: 17px; }
  .meta { color: var(--muted); font-size: 12px; display: flex; gap: 10px; flex-wrap: wrap; }
  .badge { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
  .badge.ok { background: var(--ok-soft); color: var(--ok); }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .badge.no { background: var(--surface-2); color: var(--muted); }
  .bar { height: 5px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--ok); border-radius: 99px; }
  .missing { font-size: 12px; color: var(--warn); }
  .theme-seg { display: flex; width: 100%; }
  .theme-seg button { flex: 1; padding: 10px 8px; font-size: 14px; }
  .lang-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .lang-list button { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font-size: 15px; text-align: left; }
  .lang-list button span { font-size: 20px; }
  .lang-list button.on { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
  .ai-box { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; background: var(--surface); border: 1px dashed var(--accent); border-radius: 14px; padding: 16px; margin-bottom: 24px; color: var(--muted); }
  .ai-box p { margin: 0; flex: 1; min-width: 200px; }
  .ai-box.err { border-color: var(--warn); color: var(--warn); }
  .ai-more { margin: -8px 0 24px; }
  .ai-tag { color: var(--accent); font-weight: 600; }
  .spinner { width: 18px; height: 18px; flex: none; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .r-img { margin: -16px -16px 4px; height: 0; overflow: hidden; border-radius: 14px 14px 0 0; background: var(--surface-2); transition: height .25s; }
  .r-img.loaded { height: 130px; }
  .r-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .r-img.big { margin: 4px 0 0; border-radius: 12px; }
  .r-img.big.loaded { height: 220px; }
  .img-credit { margin: 4px 0 0; font-size: 11px; color: var(--muted); }
  .img-credit a { color: var(--muted); }
  .net-img { width: calc(100% + 32px); margin: -16px -16px 4px; height: 140px; object-fit: cover; border-radius: 14px 14px 0 0; background: var(--surface-2); }
  .ok-text { color: var(--ok); }
  .section-title a { color: var(--muted); }
  a.btn { text-decoration: none; display: inline-flex; align-items: center; }
  .egg { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.35); animation: eggFade .25s ease-out; transition: opacity .45s; cursor: pointer; }
  .egg.out { opacity: 0; }
  .egg img { width: min(50vw, 220px); border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,.45); animation: eggPop .7s cubic-bezier(.2,1.5,.4,1) both, eggWiggle .5s ease-in-out .75s 2; }
  @keyframes eggFade { from { opacity: 0; } }
  @keyframes eggPop { 0% { transform: scale(.15) rotate(-30deg); opacity: 0; } 70% { transform: scale(1.08) rotate(5deg); opacity: 1; } 100% { transform: scale(1) rotate(0); } }
  @keyframes eggWiggle { 25% { transform: rotate(-4deg); } 75% { transform: rotate(4deg); } }
  @media (prefers-reduced-motion: reduce) { .egg img { animation: eggFade .3s; } }
  .tut-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
  .tut-dots { display: flex; gap: 6px; }
  .tut-dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
  .tut-dots i.done { background: var(--ok); }
  .tut-dots i.on { background: var(--accent); width: 22px; border-radius: 99px; }
  .tut-hero { font-size: 48px; line-height: 1; margin: 8px 0 10px; }
  .tut-list { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 10px; }
  .tut-list li { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; }
  .tut-actions { align-items: center; }
  .tut-step { margin-right: auto; color: var(--muted); font-size: 13px; }
  .tut-actions .btn.ghost[data-tut="back"] { margin-right: 0; }
  .cam { padding: 10px 12px; font-size: 18px; line-height: 1; }
  .scan-img { width: 100%; max-height: 220px; object-fit: cover; border-radius: 12px; margin: 8px 0 12px; }
  .scan-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .scan-item { border: 1px solid var(--line); background: var(--bg); color: var(--muted); border-radius: 999px; padding: 7px 12px; font-size: 14px; text-decoration: line-through; }
  .scan-item.on { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); font-weight: 600; text-decoration: none; }
  .scan-item.had { opacity: .6; }
  .search-row { position: relative; margin-bottom: 12px; }
  .search-row input { width: 100%; padding: 12px 14px 12px 42px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font: inherit; font-size: 16px; box-shadow: var(--shadow); }
  .search-row input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .search-ic { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 16px; pointer-events: none; }
  .prov-seg { display: flex; flex-wrap: wrap; width: 100%; margin-bottom: 12px; }
  .prov-seg button { flex: 1; padding: 9px 6px; font-size: 13px; }
  .model-sel { width: 100%; margin-bottom: 8px; }
  .lbl { display: block; font-size: 13px; font-weight: 600; margin: 4px 0 6px; }
  .chk { display: flex; gap: 8px; align-items: center; margin-top: 12px; font-size: 14px; }
  .key-row { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .jump { display: none; width: 100%; margin-top: 12px; padding: 12px; }
  @media (max-width: 860px) { .jump { display: block; } }
  .diff { font-weight: 600; letter-spacing: .02em; }
  .diff.d1 { color: var(--ok); }
  .diff.d2 { color: var(--warn); }
  .diff.d3 { color: var(--accent); }
  .placeholder { text-align: center; padding: 48px 16px; color: var(--muted); border: 2px dashed var(--line); border-radius: 16px; }
  .placeholder .big { font-size: 44px; }
  /* Modal */
  .overlay { position: fixed; inset: 0; background: rgba(20,12,6,.5); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .overlay.open { display: flex; }
  .modal { background: var(--surface); color: var(--text); border-radius: 18px; max-width: 620px; width: 100%; max-height: 90vh; overflow: auto; padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  .modal .head { display: flex; gap: 14px; align-items: center; margin-bottom: 8px; }
  .modal .head .emoji { font-size: 44px; }
  .modal h2 { font-size: 26px; }
  .modal h3 { font-size: 17px; margin: 18px 0 8px; }
  .ing { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 4px 12px; }
  .ing li { display: flex; gap: 8px; align-items: center; font-size: 14px; }
  .ing .dot { width: 18px; height: 18px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; flex: none; }
  .ing .have .dot { background: var(--ok-soft); color: var(--ok); }
  .ing .miss .dot { background: var(--warn-soft); color: var(--warn); }
  .ing .miss { color: var(--warn); }
  .ing .opt { color: var(--muted); }
  ol.steps { padding-left: 20px; margin: 0; }
  ol.steps li { margin-bottom: 8px; }
  .modal .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 20px; justify-content: flex-end; }
  form.own label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 4px; }
  form.own input, form.own textarea, form.own select { width: 100%; padding: 9px 11px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; }
  form.own textarea { min-height: 90px; resize: vertical; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; }
  .toast.show { opacity: 1; }
  /* iPhone: Notch/Home-Balken, kein Zoom beim Tippen, kein grauer Tipp-Blitz */
  html { -webkit-text-size-adjust: 100%; }
  body { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
  .wrap { padding-top: max(28px, calc(env(safe-area-inset-top) + 12px)); padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); padding-bottom: max(64px, calc(env(safe-area-inset-bottom) + 32px)); }
  .overlay { padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); }
  .modal { max-height: 90dvh; -webkit-overflow-scrolling: touch; }
  .toast { bottom: max(20px, calc(env(safe-area-inset-bottom) + 12px)); }
  @media (max-width: 600px) {
    .addrow input, select, form.own input, form.own textarea, form.own select { font-size: 16px; }
    .modal { padding: 20px 18px; border-radius: 16px; }
    .modal h2 { font-size: 22px; }
    .quick button { padding: 6px 12px; font-size: 14px; }
    .chip { font-size: 14px; }
    .chip button { width: 26px; height: 26px; }
    .grid { grid-template-columns: 1fr; }
    header .btn.small { padding: 8px 12px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>🧠 Second Brain Cookbook</h1>
      <p id="subtitle"></p>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn ghost small" id="randomBtn">🎲 <span data-i18n="random"></span></button>
      <button class="btn ghost small" id="ownBtn">＋ <span data-i18n="ownRecipe"></span></button>
      <button class="btn ghost small" id="settingsBtn">⚙️ <span data-i18n="settings"></span></button>
    </div>
  </header>

  <div class="layout">
    <aside class="side panel">
      <h2 data-i18n="pantry"></h2>
      <form class="addrow" id="addForm" autocomplete="off">
        <input id="ingInput" list="ingList">
        <button class="btn" type="submit" data-i18n="add"></button>
        <button class="btn ghost cam" type="button" id="camBtn">📷</button>
      </form>
      <input type="file" id="camInput" accept="image/*" hidden>
      <datalist id="ingList"></datalist>
      <p class="hint" data-i18n="hint"></p>
      <div class="chips" id="pantry"></div>
      <div style="display:flex;justify-content:flex-end;margin-bottom:6px">
        <button class="btn ghost small" id="clearBtn" data-i18n="clear"></button>
      </div>
      <div id="groups"></div>
      <div class="basics">🧂 <span data-i18n="basics"></span></div>
      <button class="btn jump" id="jumpBtn"></button>
    </aside>

    <main>
      <div class="search-row">
        <span class="search-ic">🔎</span>
        <input id="searchInput" type="search" autocomplete="off" enterkeyhint="search">
      </div>
      <div class="toolbar">
        <div class="seg" id="catSeg"></div>
        <select id="timeSel"></select>
        <select id="diffSel"></select>
        <select id="landSel"></select>
        <label style="font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center">
          <input type="checkbox" id="showAll"> <span data-i18n="showAll"></span>
        </label>
      </div>
      <div id="results"></div>
    </main>
  </div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>

<script>window.LANGS = window.LANGS || {};</script>
<script src="lang/en.js"></script>
<script src="lang/fr.js"></script>
<script src="lang/es.js"></script>
<script src="lang/it.js"></script>
<script src="lang/pt.js"></script>
<script src="lang/tr.js"></script>
<script src="lang/en-more.js"></script>
<script src="lang/fr-more.js"></script>
<script src="lang/es-more.js"></script>
<script src="lang/it-more.js"></script>
<script src="lang/pt-more.js"></script>
<script src="lang/tr-more.js"></script>

  ["🫓","Focaccia","Beilage",120,["mehl","hefe"],["oliven","tomaten","knoblauch"],["Mehl, Hefe, Wasser, Salz und reichlich Olivenöl zu weichem Teig verrühren.","1–2 Std. gehen lassen.","Aufs Blech drücken, mit Fingern Mulden machen, Öl und Salz drauf.","Bei 220 °C ca. 20 Min. backen."],2,"Italien"],

// ---------- Speicher ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
let pantry = new Set(store.get("kb_pantry", []));
let own = store.get("kb_own", []);
let state = { cat: "Alle", maxTime: 999, showAll: false, diff: 0, land: "Alle", q: "" };

const autoLang = () => {
  const langs = (navigator.languages || [navigator.language || "de"]).map(l => String(l).slice(0, 2).toLowerCase());
  return langs.find(l => LANGS[l]) || "de";
};
let lang = store.get("kb_lang", null);
if (!LANGS[lang]) lang = autoLang();
let L = LANGS[lang];

function t(key, vars) {
  let s = (L.ui && L.ui[key] != null) ? L.ui[key]
    : (AI_UI[lang] && AI_UI[lang][key] != null) ? AI_UI[lang][key]
    : LANGS.de.ui[key] != null ? LANGS.de.ui[key] : AI_UI.de[key];
  if (vars && typeof s === "string") for (const k in vars) s = s.split("{" + k + "}").join(vars[k]);
  return s;
}
const nameOf = id => (L.ing && L.ing[id]) || (ING[id] ? ING[id][0] : String(id).charAt(0).toUpperCase() + String(id).slice(1));
const catName = c => (L.cat && L.cat[c]) || c;
const landName = l => (L.land && L.land[l]) || l;

function allRecipes() {
  const base = R.map((r, i) => {
    const m = META[r[1]] || [1, "International"];
    const tr = L.r && L.r[r[1]];
    return { id: "r" + i, emoji: r[0], name: tr ? tr[0] : r[1], cat: r[2], time: r[3], req: r[4], opt: r[5],
      steps: tr && tr[1] && tr[1].length ? tr[1] : r[6], diff: r[7] || m[0], land: r[8] || m[1] };
  });
  return base.concat(own.map((o, i) => ({ diff: 1, land: OWN_LAND, ...o, id: "o" + i, own: true })));
}
const diffBadge = d => `<span class="diff d${d}" title="${t("difficulty")}">${"●".repeat(d)}${"○".repeat(3 - d)} ${t("diff")[d]}</span>`;
const fmtTime = m => m >= 60 ? `${Math.floor(m / 60)} ${t("hours")}${m % 60 ? " " + (m % 60) + " " + t("min") : ""}` : `${m} ${t("min")}`;

// ---------- Zutaten erkennen ----------
const stem = s => s.toLowerCase().trim().replace(/\s+/g, " ").replace(/(en|es|n|e|s)$/, "");
let lookup = new Map();
function buildLookup() {
  lookup = new Map();
  const put = (w, id) => { lookup.set(w.toLowerCase(), id); lookup.set(stem(w), id); };
  for (const [id, [n, , al]] of Object.entries(ING)) [n, id, ...al].forEach(w => put(w, id));
  // Namen der gewählten Sprache haben Vorrang (z. B. engl. "paprika" = Paprikapulver)
  for (const [id, n] of Object.entries(L.ing || {})) String(n).split("/").forEach(w => put(w.trim(), id));
}
function resolve(text) {
  const s = text.toLowerCase().trim();
  if (!s) return null;
  return lookup.get(s) || lookup.get(stem(s)) || s; // unbekannt → als freier Text behalten
}

// ---------- Matching ----------
function evaluate(r) {
  // Rezept-Zutaten sind schon IDs – nur freie Texte (eigene Rezepte) werden übersetzt
  // KI-Rezepte sind schon aufgelöst; ihr "hat"-Hinweis zählt für Zutaten, die das Kochbuch nicht kennt
  const norm = x => (ING[x] || r.resolved) ? x : resolve(x);
  const has = x => pantry.has(x) || (r.aiHave ? r.aiHave.includes(x) : false);
  const req = r.req.map(norm);
  const opt = (r.opt || []).map(norm);
  const have = req.filter(has);
  const missing = req.filter(x => !has(x));
  const optHave = opt.filter(has);
  return { req, opt, have, missing, optHave, ratio: req.length ? have.length / req.length : 0 };
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const sortLoc = (a, b) => a.localeCompare(b, L.locale || lang);

function card(r, ev) {
  let badge;
  if (!ev.missing.length) badge = `<span class="badge ok">✓ ${t("allThere")}</span>`;
  else if (ev.missing.length <= 2) badge = `<span class="badge warn">${t("missingN", { n: ev.missing.length })}</span>`;
  else badge = `<span class="badge no">${ev.have.length}/${ev.req.length}</span>`;
  const wk = recipeKey(r);
  return `<button class="card" data-open="${r.id}">
    ${wk ? `<div class="r-img" data-wiki="${esc(wk)}"></div>` : ""}
    <div class="top"><span class="emoji">${r.emoji || "🍽️"}</span>${badge}</div>
    <h3>${esc(r.name)}</h3>
    <div class="meta"><span>⏱ ${fmtTime(r.time)}</span>${r.land ? `<span>🌍 ${esc(landName(r.land))}</span>` : ""}${r.own ? `<span>★ ${t("ownTag")}</span>` : ""}${r.ai ? `<span class="ai-tag">✨ ${t("aiTag")}</span>` : ""}</div>
    <div class="meta">${diffBadge(r.diff)}<span>${esc(catName(r.cat))}</span></div>
    <div class="bar"><i style="width:${Math.round(ev.ratio * 100)}%"></i></div>
    ${ev.missing.length && ev.missing.length <= 3 ? `<div class="missing">${t("needStill")} ${ev.missing.map(nameOf).map(esc).join(", ")}</div>` : ""}
    ${ev.optHave.length ? `<div class="meta">+ ${t("goesWith")} ${ev.optHave.map(nameOf).map(esc).join(", ")}</div>` : ""}
  </button>`;
}

function renderResults() {
  const list = allRecipes()
    .filter(r => state.cat === "Alle" || r.cat === state.cat)
    .filter(r => r.time <= state.maxTime)
    .filter(r => !state.diff || r.diff === state.diff)
    .filter(r => state.land === "Alle" || r.land === state.land)
    .map(r => ({ r, ev: evaluate(r) }))
    .sort((a, b) => a.ev.missing.length - b.ev.missing.length || b.ev.optHave.length - a.ev.optHave.length || a.r.time - b.r.time);

  const ready = list.filter(x => !x.ev.missing.length);
  const almost = list.filter(x => x.ev.missing.length > 0 && x.ev.missing.length <= 2 && x.ev.have.length > 0);
  const rest = list.filter(x => !ready.includes(x) && !almost.includes(x));
  const out = [];

  if (state.q.trim()) {
    // Rezeptsuche: Name, Land, Kategorie oder Zutat (alle Suchwörter müssen passen)
    const words = normText(state.q).split(/\s+/).filter(Boolean);
    const hits = list.map(x => ({ ...x, score: searchScore(x.r, words) })).filter(x => x.score > 0)
      .sort((a, b) => b.score - a.score || a.ev.missing.length - b.ev.missing.length || a.r.name.localeCompare(b.r.name));
    out.push(hits.length
      ? section(`🔎 ${esc(t("searchTitle", { q: state.q.trim() }))}`, t("count", { n: hits.length }), hits)
      : `<div class="section-title"><h2>🔎 ${esc(t("searchTitle", { q: state.q.trim() }))}</h2></div><div class="placeholder"><div class="big">🔍</div><p>${t("searchNone")}</p></div>`);
    out.push(netQSection());
  } else if (!pantry.size && !state.showAll) {
    out.push(`<div class="placeholder"><div class="big">🧺</div><p><b>${t("startTitle")}</b><br>${t("startText")}</p></div>`);
  } else {
    if (ready.length) out.push(section(t("ready"), t("count", { n: ready.length }), ready));
    if (almost.length) out.push(section(t("almost"), t("count", { n: almost.length }), almost));
    if (!ready.length && !almost.length && pantry.size)
      out.push(`<div class="placeholder"><div class="big">🤔</div><p>${t("noneTitle")}<br>${t("noneText")}</p></div>`);
    out.push(aiSection(needsAI()));
    out.push(netSection());
    if (state.showAll && rest.length) out.push(section(t("more"), t("count", { n: rest.length }), rest));
  }
  $("#results").innerHTML = out.join("");
  observeImgs($("#results"));
  $("#jumpBtn").textContent = "🍽️ " + (pantry.size ? t("jumpCount", { a: ready.length, b: almost.length }) : t("jump"));
}
// ---------- Rezeptsuche ----------
const normText = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/ß/g, "ss");
function searchScore(r, words) {
  const base = r.id[0] === "r" ? R[+r.id.slice(1)][1] : "";
  const name = normText(r.name + " " + base);
  const rest = normText([landName(r.land), r.land, catName(r.cat), ...r.req.map(nameOf), ...(r.opt || []).map(nameOf),
    ...r.req, ...(r.opt || [])].join(" "));
  let score = 0;
  for (const w of words) {
    if (name.includes(w)) score += name.startsWith(w) ? 3 : 2;
    else if (rest.includes(w)) score += 1;
    else return 0; // jedes Suchwort muss irgendwo vorkommen
  }
  return score;
}

// Suche zusätzlich bei TheMealDB nach dem Rezeptnamen
let netQ = { q: "", status: "idle", meals: [] };
let netQTimer = null;
function scheduleNetQ() {
  clearTimeout(netQTimer);
  const q = state.q.trim();
  if (q.length < 3) { netQ = { q, status: "idle", meals: [] }; return; }
  if (netQ.q === q) return;
  netQ = { q, status: "loading", meals: [] };
  netQTimer = setTimeout(async () => {
    try {
      const data = await netFetch(MEALDB + "search.php?s=" + encodeURIComponent(q));
      if (netQ.q === q) netQ = { q, status: "done", meals: (data.meals || []).slice(0, 9) };
    } catch { if (netQ.q === q) netQ = { q, status: "error", meals: [] }; }
    if (state.q.trim() === q) renderResults();
  }, 500);
}
function netQSection() {
  if (netQ.status === "idle" || netQ.q !== state.q.trim()) return "";

function applyTheme(pref) {
  const root = document.documentElement;
  const [mLight, mDark] = document.querySelectorAll('meta[name="theme-color"]');
  const sb = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
  if (pref === "light" || pref === "dark") {
    root.setAttribute("data-theme", pref);
    const c = pref === "dark" ? "#1c1916" : "#faf6ef";
    if (mLight) { mLight.content = c; mLight.removeAttribute("media"); }
    if (mDark) { mDark.content = c; mDark.removeAttribute("media"); }
    if (sb) sb.content = pref === "dark" ? "black" : "default";
  } else {
    root.removeAttribute("data-theme");
    if (mLight) { mLight.content = "#faf6ef"; mLight.media = "(prefers-color-scheme: light)"; }
    if (mDark) { mDark.content = "#1c1916"; mDark.media = "(prefers-color-scheme: dark)"; }
    if (sb) sb.content = "default";
  }
}

// Anfrage an einen Anbieter; Fehler werden in verständliche Meldungen übersetzt
async function provFetch(url, opts) {
  let r;
  try { r = await fetch(url, opts); }
  catch { throw { aiMessage: navigator.onLine ? t("aiError", { x: "Netzwerk" }) : t("aiOffline") }; }
  let j = null;
  try { j = await r.json(); } catch {}
  if (!r.ok) {
    const msg = String((j && j.error && (j.error.message || j.error)) || r.statusText || "");
    if (r.status === 401 || r.status === 403 || (r.status === 400 && /api key/i.test(msg))) throw { aiMessage: t("aiBadKey") };
    if (r.status === 402 || /quota|billing|credit|balance/i.test(msg)) throw { aiMessage: t("aiNoCredit") };
    if (r.status === 429) throw { aiMessage: t("aiRate") };
    throw { aiMessage: t("aiError", { x: `${r.status} ${msg.slice(0, 160)}` }) };
  }
  return j;
}

// Verfügbare Modelle des Anbieters abrufen (für die Auswahl in den Einstellungen)
async function listModels(p, key) {
  if (p === "anthropic") return [AI_MODEL];
  if (aiModelsCache[p]) return aiModelsCache[p];
  let ids = [];
  if (p === "openai") {
    const j = await provFetch("https://api.openai.com/v1/models", { headers: { Authorization: "Bearer " + key } });
    ids = (j.data || []).map(m => m.id).filter(id => /^(gpt-|o\d|chatgpt-)/.test(id)
      && !/(audio|realtime|transcribe|tts|image|search|embedding|instruct|codex|moderation|preview)/.test(id));
  } else if (p === "deepseek") {
    const j = await provFetch("https://api.deepseek.com/models", { headers: { Authorization: "Bearer " + key } });
    ids = (j.data || []).map(m => m.id);
  } else if (p === "openrouter") {
    const j = await provFetch("https://openrouter.ai/api/v1/models");
    // nur Modelle, die Text ausgeben und Text + Bilder lesen (für Rezept- und Foto-Suche)
    ids = (j.data || []).filter(m => {
      const a = m.architecture || {};
      return (a.output_modalities || ["text"]).join() === "text" && (a.input_modalities || []).includes("image") && !/:batch$/.test(m.id);
    }).map(m => m.id);
  } else if (p === "gemini") {
    const j = await provFetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=200", { headers: { "x-goog-api-key": key } });
    ids = (j.models || []).filter(m => (m.supportedGenerationMethods || []).includes("generateContent"))
      .map(m => m.name.replace(/^models\//, "")).filter(id => /^gemini/.test(id) && !/(tts|image|embedding|live|audio)/.test(id));
  }
  ids.sort().reverse(); // grob: neuere Versionen zuerst
  return aiModelsCache[p] = ids;
}
function defaultModel(p, ids) {
  const pick = res => { for (const re of res) { const m = ids.find(id => re.test(id)); if (m) return m; } return ids[0] || ""; };
  if (p === "openai") return pick([/^gpt-[\d.]+o?-mini$/, /^gpt-[\d.]+o?$/, /^gpt-/]);
  if (p === "deepseek") return pick([/^deepseek-chat$/, /chat/]);
  if (p === "gemini") return pick([/^gemini-[\d.]+-flash$/, /flash(?!.*(lite|preview|exp))/, /flash/, /pro/]);
  if (p === "openrouter") return pick([/^openai\/gpt-[^:]*mini$/, /^openai\/gpt-(?!.*pro)[^:]*$/, /^openai\/gpt-/, /^anthropic\//]);
  return AI_MODEL;
}
async function currentModel(p, key) {
  const m = aiModel();
  if (m) return m;
  const d = defaultModel(p, await listModels(p, key));
  if (!d) throw { aiMessage: t("aiError", { x: "no model" }) };
  return d;
}
const parseJSON = s => {
  try { return JSON.parse(s); }
  catch { const m = String(s || "").match(/\{[\s\S]*\}/); if (m) { try { return JSON.parse(m[0]); } catch {} } throw { aiMessage: t("aiError", { x: "JSON" }) }; }
};

// Gemeinsame KI-Anfrage: liefert ein JSON-Objekt nach Schema, egal welcher Anbieter
async function aiJSON({ system, text, image, schema, effort }) {
  const p = aiProvider(), key = aiKey();
  if (p === "anthropic") {
    const Anthropic = await loadSDK();
    const client = new Anthropic({ apiKey: key, dangerouslyAllowBrowser: true });
    const content = image
      ? [{ type: "image", source: { type: "base64", media_type: "image/jpeg", data: image.split(",")[1] } }, { type: "text", text }]
      : text;
    const response = await client.beta.messages.create({
      model: AI_MODEL,
      max_tokens: 16000,
      betas: ["server-side-fallback-2026-07-01"],
      fallbacks: "default",
      output_config: { effort, format: { type: "json_schema", schema } },
      system,
      messages: [{ role: "user", content }],
    });
    if (response.stop_reason === "refusal") throw { aiMessage: t("aiNothing") };
    if (response.stop_reason === "max_tokens") throw { aiMessage: t("aiError", { x: "max_tokens" }) };
    const textBlock = response.content.find(b => b.type === "text");
    return parseJSON(textBlock ? textBlock.text : "{}");
  }
  const model = await currentModel(p, key);
  const schemaHint = "\n\nAnswer only with a JSON object that matches this JSON schema:\n" + JSON.stringify(schema);
  if (p === "openai" || p === "deepseek" || p === "openrouter") {
    const url = { openai: "https://api.openai.com/v1/chat/completions", deepseek: "https://api.deepseek.com/chat/completions",
      openrouter: "https://openrouter.ai/api/v1/chat/completions" }[p];
    const user = image ? [{ type: "text", text }, { type: "image_url", image_url: { url: image } }] : text;
    const headers = { "Content-Type": "application/json", Authorization: "Bearer " + key };
    if (p === "openrouter") headers["X-Title"] = "Second Brain Cookbook";
    const j = await provFetch(url, {
      method: "POST",
      headers,
      body: JSON.stringify({
        model,
        messages: [{ role: "system", content: system + (p === "deepseek" ? schemaHint : "") }, { role: "user", content: user }],
        response_format: p !== "deepseek"
          ? { type: "json_schema", json_schema: { name: "result", strict: true, schema } }
          : { type: "json_object" },
      }),
    });
    const c = j && j.choices && j.choices[0];
    if (!c || c.message.refusal) throw { aiMessage: t("aiNothing") };
    if (c.finish_reason === "length") throw { aiMessage: t("aiError", { x: "max_tokens" }) };
    return parseJSON(c.message.content);
  }
  // Gemini
  const parts = [{ text }];
  if (image) parts.push({ inline_data: { mime_type: "image/jpeg", data: image.split(",")[1] } });
  const j = await provFetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
    method: "POST",
    headers: { "Content-Type": "application/json", "x-goog-api-key": key },
    body: JSON.stringify({
      systemInstruction: { parts: [{ text: system + schemaHint }] },
      contents: [{ role: "user", parts }],
      generationConfig: { responseMimeType: "application/json" },
    }),
  });
  const cand = j && j.candidates && j.candidates[0];
  if (!cand || !cand.content) throw { aiMessage: t("aiNothing") };
  return parseJSON((cand.content.parts || []).map(x => x.text || "").join(""));
}

// KI nur, wenn das Kochbuch selbst nichts findet oder eine unbekannte Zutat dabei ist
function needsAI() {
  if (!pantry.size) return false;
  const evs = allRecipes().map(evaluate);
  const found = evs.some(e => !e.missing.length || (e.missing.length <= 2 && e.have.length > 0));
  return !found || [...pantry].some(id => !ING[id]);
}

function scheduleAI() {
  clearTimeout(aiTimer);
  const k = pantryKey();
  if (ai.key !== k) ai = aiCache[k] ? { key: k, status: "done", recipes: aiCache[k], error: "" } : { key: k, status: "idle", recipes: [], error: "" };
  if (ai.status !== "idle" || !aiKey() || !aiAuto() || !needsAI()) return;
  aiTimer = setTimeout(() => runAI(false), 1200);
}

function toAIRecipe(x, i) {
  const req = [], opt = [], aiHave = [];
  for (const ing of x.ingredients || []) {
    const name = String(ing.name || "").trim();
    if (!name) continue;
    const id = resolve(name);
    const v = ING[id] ? id : name;
    if (ing.have && !ING[id]) aiHave.push(v);
    const list = ing.optional ? opt : req;
    if (!req.includes(v) && !opt.includes(v)) list.push(v);
  }
  return {
    id: "a" + i, ai: true, resolved: true, aiHave,
    emoji: x.emoji || "✨", name: String(x.name || "?"), land: String(x.cuisine || ""),
    cat: CATS.includes(x.category) && x.category !== "Alle" ? x.category : "Hauptgericht",
    time: Math.max(1, Math.round(+x.time_minutes || 30)),
    diff: Math.min(3, Math.max(1, Math.round(+x.difficulty || 1))),
    req, opt, steps: (x.steps || []).map(String).filter(Boolean),
  };
}

function aiErrorText(e) {
  const A = AnthropicSDK;
  if (e && e.aiMessage) return e.aiMessage;
  if (A) {
    if (e instanceof A.AuthenticationError || e instanceof A.PermissionDeniedError) return t("aiBadKey");
    if (e instanceof A.RateLimitError) return t("aiRate");
    if (e instanceof A.APIConnectionError) return t("aiOffline");
    if (e instanceof A.APIError) return t("aiError", { x: `${e.status || ""} ${e.message}`.trim() });
  }
  if (!navigator.onLine) return t("aiOffline");
  return t("aiError", { x: e && e.message ? e.message : String(e) });
}

async function runAI(more) {
  const apiKey = aiKey();
  if (!apiKey) { openSettings(); return; }
  clearTimeout(aiTimer);
  const k = pantryKey();
  const prev = more && ai.key === k ? ai.recipes : [];
  ai = { key: k, status: "loading", recipes: prev, error: "" };
  renderResults();
  try {
    const items = [...pantry].map(nameOf);
    const avoid = prev.map(r => r.name);
    const data = await aiJSON({
      schema: AI_SCHEMA,
      effort: "medium",
      system:
        "You are the recipe assistant inside a home cookbook app. The user lists what they have at home. " +
        "Suggest real, tasty dishes that mainly use those ingredients. Salt, pepper, cooking oil and water are always available: never list them. " +
        "Set have=true only for ingredients the user listed (or obvious equivalents). Keep missing ingredients to at most 2 per recipe and prefer recipes that need none. " +
        "Mark garnishes and extras as optional. difficulty: 1 easy, 2 medium, 3 hard. " +
        `Write every text field (name, cuisine, ingredient names, steps) in ${LANGS[lang].name}. ` +
        "Give 3 to 6 short, concrete steps with amounts, times and temperatures.",
      text: `My ingredients: ${items.join(", ")}\nSuggest 3 recipes.` +
        (avoid.length ? `\nDo not repeat these dishes: ${avoid.join(", ")}` : ""),
    });
    const all = prev.concat((data.recipes || []).map((x, i) => toAIRecipe(x, prev.length + i)));
    aiCache[k] = all;
    const keys = Object.keys(aiCache); // nur die letzten 10 Suchen behalten
    while (keys.length > 10) delete aiCache[keys.shift()];
    store.set("kb_ai_cache", aiCache);
    if (ai.key === k) ai = { key: k, status: all.length ? "done" : "empty", recipes: all, error: "" };
  } catch (e) {
    if (ai.key === k) ai = { key: k, status: "error", recipes: prev, error: aiErrorText(e) };
  }
  renderResults();
}

function aiSection(need) {
  if (!pantry.size) return "";
  const k = pantryKey();
  const cur = ai.key === k ? ai : { status: "idle", recipes: [], error: "" };
  const moreBtn = `<div class="ai-more"><button class="btn ghost small" data-ai="more">✨ ${t("aiMore")}</button></div>`;
  if (!need && cur.status === "idle") return aiKey() ? moreBtn : "";
  const head = `<div class="section-title"><h2>✨ ${t("aiTitle")}</h2>${cur.recipes.length ? `<span>${t("count", { n: cur.recipes.length })}</span>` : ""}</div>`;
  const grid = cur.recipes.length ? `<div class="grid">${cur.recipes.map(r => card(r, evaluate(r))).join("")}</div>` : "";
  let box;
  if (!aiKey()) box = `<div class="ai-box"><p>${t("aiNoKey")}</p><button class="btn small" data-ai="settings">🔑 ${t("aiOpenSettings")}</button></div>`;
  else if (cur.status === "loading") box = `<div class="ai-box"><span class="spinner"></span><p>${t("aiLoading")}</p></div>`;
  else if (cur.status === "error") box = `<div class="ai-box err"><p>${esc(cur.error)}</p><button class="btn small" data-ai="run">${t("aiRetry")}</button></div>`;
  else if (cur.status === "empty") box = `<div class="ai-box"><p>${t("aiNothing")}</p><button class="btn small" data-ai="run">${t("aiRetry")}</button></div>`;
  else if (cur.status === "done") box = moreBtn;
  else box = `<div class="ai-box"><p>${t("aiAsk")}</p><button class="btn small" data-ai="run">✨ ${t("aiButton")}</button></div>`;
  return head + grid + box;
}

// ---------- Foto-Suche: Zutaten auf einem Foto erkennen ----------
let scan = { items: [] };

async function fileToJpeg(file, max = 1568) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", 0.85);
  } finally { URL.revokeObjectURL(url); }
}

function scanModal(dataUrl, body) {
  $("#modal").innerHTML = `<h2>📷 ${t("camTitle")}</h2>${dataUrl ? `<img class="scan-img" src="${dataUrl}" alt="">` : ""}${body}`;
  $("#overlay").classList.add("open");
}

function renderScanResult(dataUrl) {
  const n = scan.items.filter(x => x.on).length;
  scanModal(dataUrl, scan.items.length
    ? `<p class="hint">${t("camFound")}</p>
       <div class="scan-list">${scan.items.map((x, i) =>
         `<button class="scan-item ${x.on ? "on" : ""} ${x.had ? "had" : ""}" data-scan="${i}">${esc(nameOf(x.id))}${x.had ? ` · ${t("camAlready")}` : ""}</button>`).join("")}</div>
       <div class="actions"><button class="btn ghost small" data-close>${t("cancel")}</button>
       <button class="btn small" data-scan-add="1" ${n ? "" : "disabled"}>＋ ${t("camAdd", { n })}</button></div>`
    : `<div class="ai-box"><p>${t("camNone")}</p></div><div class="actions"><button class="btn small" data-close>${t("close")}</button></div>`);
  scan.dataUrl = dataUrl;
}

async function scanPhoto(file) {
  const apiKey = aiKey();
  if (!apiKey) { toast(t("camNeedKey")); openSettings(); return; }
  if (!AI_PROVIDERS[aiProvider()].vision) { toast(t("aiNoVision", { p: AI_PROVIDERS[aiProvider()].name })); openSettings(); return; }
  let dataUrl;
  try { dataUrl = await fileToJpeg(file); }
  catch { scanModal("", `<div class="ai-box err"><p>${t("camImgError")}</p></div><div class="actions"><button class="btn small" data-close>${t("close")}</button></div>`); return; }
  scanModal(dataUrl, `<div class="ai-box"><span class="spinner"></span><p>${t("camLoading")}</p></div>`);
  try {
    const catalog = Object.keys(ING).map(id => `${id} = ${ING[id][0]}${L.ing && L.ing[id] ? " / " + L.ing[id] : ""}`).join("\n");
    const data = await aiJSON({
      effort: "low",
      image: dataUrl,
      schema: {
        type: "object", additionalProperties: false, required: ["items"],
        properties: { items: { type: "array", items: {
          type: "object", additionalProperties: false, required: ["catalog_id", "name"],
          properties: { catalog_id: { type: "string", enum: [...Object.keys(ING), "other"] }, name: { type: "string" } },
        } } },
      },
      system:
        "You identify food ingredients visible in a photo (fridge, pantry shelf, groceries, kitchen counter). " +
        "List each distinct food item once and only what you can actually see. Ignore non-food items and ignore salt, pepper, cooking oil and water. " +
        "If an item matches an entry of this catalog, use its id as catalog_id; otherwise use \"other\". " +
        `Always give a short ingredient name in ${LANGS[lang].name}.\n\nCatalog (id = name):\n${catalog}`,
      text: "Which ingredients can you see in this photo?",
    });
    const seen = new Set();
    scan.items = [];
    for (const it of data.items || []) {
      const id = it.catalog_id !== "other" && ING[it.catalog_id] ? it.catalog_id : resolve(String(it.name || ""));
      if (!id || seen.has(id)) continue;
      seen.add(id);
      scan.items.push({ id, had: pantry.has(id), on: !pantry.has(id) });
    }
    renderScanResult(dataUrl);
  } catch (e) {
    scanModal(dataUrl, `<div class="ai-box err"><p>${esc(aiErrorText(e))}</p></div><div class="actions"><button class="btn small" data-close>${t("close")}</button></div>`);
  }
}

const imgCache = store.get("kb_img2", {});
const imgPending = {};

function wikiImage(key) {
  if (key in imgCache) return Promise.resolve(imgCache[key]);
  if (imgPending[key]) return imgPending[key];
  const [wiki, title] = key.startsWith("de:") ? ["de", key.slice(3)] : ["en", key];
  return imgPending[key] = fetch(`https://${wiki}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}?redirect=true`,
      { headers: { "Api-User-Agent": "SecondBrainCookbook/1.0 (private hobby recipe app)" } })
    .then(r => r.ok ? r.json() : null)
    .then(j => {
      // 500px-Vorschau (Wikimedia liefert nur Standardgrößen); ist das Original kleiner, das Original nehmen (größere Vorschaubilder gibt es dann nicht)
      const big = j && j.originalimage && j.originalimage.width >= 500 && j.thumbnail
        ? j.thumbnail.source.replace(/\/\d+px-/, "/500px-") : j && j.originalimage && j.originalimage.source;
      const img = j && j.thumbnail && safeUrl(big)
        ? { src: big, page: safeUrl(j.content_urls && j.content_urls.desktop && j.content_urls.desktop.page) }
        : null;
      imgCache[key] = img; store.set("kb_img2", imgCache);
      return img;
    })
    .catch(() => null) // offline: kein Bild, später nochmal versuchen
    .finally(() => { delete imgPending[key]; });
}

const imgObserver = "IntersectionObserver" in window ? new IntersectionObserver(entries => {
  for (const e of entries) if (e.isIntersecting) { imgObserver.unobserve(e.target); fillImg(e.target); }
}, { rootMargin: "300px" }) : null;

function fillImg(el) {
  wikiImage(el.dataset.wiki).then(img => {
    if (!img) { el.remove(); return; }
    const i = new Image();
    i.alt = ""; i.loading = "lazy"; i.decoding = "async";
    i.onload = () => {
      el.classList.add("loaded");
      if (el.dataset.credit !== undefined && img.page)
        el.insertAdjacentHTML("afterend", `<p class="img-credit">📷 ${t("imgCredit")} · <a href="${esc(img.page)}" target="_blank" rel="noopener">Wikipedia</a></p>`);
    };
    i.onerror = () => el.remove();
    i.src = img.src;
    el.appendChild(i);
  });
}
function observeImgs(root) {
  root.querySelectorAll("[data-wiki]:not([data-seen])").forEach(el => {
    el.dataset.seen = "1";
    imgObserver ? imgObserver.observe(el) : fillImg(el);

}

};
const netQueries = id => (MEALDB_MAP[id]
  || (LANGS.en && LANGS.en.ing[id] ? [LANGS.en.ing[id].toLowerCase()]
  : !ING[id] ? [String(id).toLowerCase()] : [])).slice(0, 3); // unbekannte Zutaten so suchen, wie sie eingetippt wurden
let net = { key: "", status: "idle", meals: [] };
const netFilterCache = {}, netMealCache = {};
let netTimer = null;

function scheduleNet() {
  clearTimeout(netTimer);
  const k = [...pantry].sort().join(",");
  if (net.key === k) return;
  net = { key: k, status: pantry.size ? "loading" : "idle", meals: [] };
  if (pantry.size) netTimer = setTimeout(() => runNet(k), 700);
}

async function netFetch(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

async function runNet(k) {
  const ids = [...pantry].filter(id => netQueries(id).length);
  if (!ids.length) { if (net.key === k) { net.status = "nomap"; renderResults(); } return; }
  const score = new Map(); // idMeal -> { meal, ids:Set }
  let failed = 0, total = 0;
  await Promise.all(ids.slice(0, 8).flatMap(id => netQueries(id).map(async q => {
    total++;
    try {
      const url = MEALDB + "filter.php?i=" + encodeURIComponent(q.replace(/ /g, "_"));
      const data = netFilterCache[url] || (netFilterCache[url] = await netFetch(url));
      for (const m of data.meals || []) {
        const e = score.get(m.idMeal) || { meal: m, ids: new Set() };
        e.ids.add(id); score.set(m.idMeal, e);
      }
    } catch { failed++; }
  })));
  if (net.key !== k) return; // Vorrat hat sich inzwischen geändert
  const meals = [...score.values()].sort((a, b) => b.ids.size - a.ids.size || a.meal.strMeal.localeCompare(b.meal.strMeal)).slice(0, 9);
  net = { key: k, status: failed && failed === total ? "error" : meals.length ? "done" : "empty", meals };
  renderResults();
}

const safeUrl = u => /^https?:\/\//i.test(String(u || "")) ? String(u) : "";

function netSection() {
  if (!pantry.size) return "";
  const head = `<div class="section-title"><h2>🌐 ${t("netTitle")}</h2><span>${net.meals.length ? t("count", { n: net.meals.length }) + " · " : ""}<a href="https://www.themealdb.com/" target="_blank" rel="noopener">${t("netSource")}</a></span></div>`;
  if (net.status === "loading") return head + `<div class="ai-box"><span class="spinner"></span><p>${t("netLoading")}</p></div>`;
  if (net.status === "error") return head + `<div class="ai-box err"><p>${t("netError")}</p></div>`;
  if (net.status === "nomap" || net.status === "empty") return head + `<div class="ai-box"><p>${t(net.status === "nomap" ? "netNoMap" : "netNone")}</p></div>`;
  if (net.status !== "done") return "";
  return head + `<div class="grid">${net.meals.map(({ meal, ids }) => `
    <button class="card net-card" data-net="${esc(meal.idMeal)}">
      ${safeUrl(meal.strMealThumb) ? `<img class="net-img" loading="lazy" src="${esc(safeUrl(meal.strMealThumb))}" alt="">` : ""}
      <h3>${esc(meal.strMeal)}</h3>
      <div class="meta">${meal.strArea ? `<span>🌍 ${esc(meal.strArea)}</span>` : ""}<span>🌐 TheMealDB</span></div>
      <div class="missing ok-text">✓ ${t("netMatch", { a: ids.size })}: ${[...ids].map(nameOf).map(esc).join(", ")}</div>
    </button>`).join("")}</div>`;
}

// Steht eine Zutat aus dem Internet-Rezept in deinem Vorrat?
function netHave(ingName) {
  const s = ingName.toLowerCase().trim();
  if (/^(salt|sea salt|black pepper|pepper|water|oil|olive oil|vegetable oil|sunflower oil|cold water|hot water)$/.test(s)) return true;
  // "Chicken Stock" ist kein Hähnchen, "Tomato Puree" keine Tomate
  const MODS = ["stock", "paste", "powder", "sauce", "juice", "puree", "oil", "vinegar", "flakes", "cube", "leaves", "seeds", "extract", "jam"];
  const modOf = str => MODS.filter(m => new RegExp("\\b" + m + "\\b").test(str));
  for (const id of pantry) {
    const terms = [...netQueries(id), (LANGS.en && LANGS.en.ing[id] || "").toLowerCase()].filter(Boolean);
    if (terms.some(x => {
      if (s === x || stem(s) === stem(x)) return true;
      if (!(s.includes(x) || x.includes(s))) return false;
      const ms = modOf(s), mx = modOf(x);
      return ms.every(m => mx.includes(m)) && mx.every(m => ms.includes(m));
    })) return true;
  }
  return false;
}

async function openNetMeal(idMeal) {
  $("#modal").innerHTML = `<div class="ai-box"><span class="spinner"></span><p>${t("netLoading")}</p></div>`;
  $("#overlay").classList.add("open");
  try {
    const url = MEALDB + "lookup.php?i=" + encodeURIComponent(idMeal);
    const m = netMealCache[idMeal] || (netMealCache[idMeal] = ((await netFetch(url)).meals || [])[0]);
    if (!m) throw new Error("not found");
    const ings = [];
    for (let i = 1; i <= 20; i++) {
      const n = (m["strIngredient" + i] || "").trim();
      if (n) ings.push({ n, q: (m["strMeasure" + i] || "").trim() });
    }
    const steps = String(m.strInstructions || "").split(/\r?\n+/).map(s => s.trim())
      .filter(s => s && !/^(step\s*)?\d+\.?$/i.test(s));
    const missing = ings.filter(x => !netHave(x.n)).map(x => x.n);
    const src = safeUrl(m.strSource), yt = safeUrl(m.strYoutube), img = safeUrl(m.strMealThumb);
    $("#modal").innerHTML = `
      ${img ? `<img class="scan-img" src="${esc(img)}" alt="">` : ""}
      <h2>${esc(m.strMeal)}</h2>
      <div class="meta">${m.strArea ? `<span>🌍 ${esc(m.strArea)}</span>` : ""}${m.strCategory ? `<span>${esc(m.strCategory)}</span>` : ""}</div>
      ${lang !== "en" ? `<p class="hint">🇬🇧 ${t("netEnglish")}</p>` : ""}
      <h3>${t("ingredients")}</h3>
      <ul class="ing">${ings.map(x => `<li class="${netHave(x.n) ? "have" : "miss"}"><span class="dot">${netHave(x.n) ? "✓" : "!"}</span>${esc(x.n)}${x.q ? ` <small class="hint">· ${esc(x.q)}</small>` : ""}</li>`).join("")}</ul>
      <h3>${t("preparation")}</h3>
      <ol class="steps">${steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol>
      <p class="hint">${t("netSource")}: <a href="https://www.themealdb.com/meal/${encodeURIComponent(m.idMeal)}" target="_blank" rel="noopener">themealdb.com</a></p>
      <div class="actions">
        ${src ? `<a class="btn ghost small" href="${esc(src)}" target="_blank" rel="noopener">🔗 ${t("netOpen")}</a>` : ""}
        ${yt ? `<a class="btn ghost small" href="${esc(yt)}" target="_blank" rel="noopener">▶️ ${t("netVideo")}</a>` : ""}
        ${missing.length ? `<button class="btn ghost small" data-copy="${esc(missing.join(", "))}">📋 ${t("copyMissing")}</button>` : ""}
        <button class="btn small" data-close>${t("close")}</button>
      </div>`;
  } catch {
    $("#modal").innerHTML = `<div class="ai-box err"><p>${t("netError")}</p></div><div class="actions"><button class="btn small" data-close>${t("close")}</button></div>`;
  }
}

const tut = { active: false, step: 0 };
const TUT_STEPS = ["lang", "theme", "how", "ai", "done"];

function openTutorial(step) {
  tut.active = true; tut.step = Math.max(0, Math.min(TUT_STEPS.length - 1, step));
  const kind = TUT_STEPS[tut.step];
  const last = tut.step === TUT_STEPS.length - 1;
  const theme = store.get("kb_theme", "system");
  let body = "";
  if (kind === "lang") body = `
    <div class="tut-hero">👋</div>
    <h2>${t("tutWelcome")}</h2>
    <p class="hint">${t("tutIntro")}</p>
    <h3>${t("tutLangQ")}</h3>
    <div class="lang-list">${LANG_ORDER.map(c => `<button data-tut-lang="${c}" class="${c === lang ? "on" : ""}"><span>${LANGS[c].flag}</span>${esc(LANGS[c].name)}</button>`).join("")}</div>`;
  else if (kind === "theme") body = `
    <div class="tut-hero">🎨</div>
    <h2>${t("tutThemeTitle")}</h2>
    <div class="seg theme-seg">${[["system", "🖥️"], ["light", "☀️"], ["dark", "🌙"]].map(([k, ic]) =>
      `<button data-theme-opt="${k}" class="${theme === k ? "on" : ""}">${ic} ${t(k)}</button>`).join("")}</div>
    <p class="hint">${t("systemHint")}</p>`;
  else if (kind === "how") body = `
    <div class="tut-hero">🍳</div>
    <h2>${t("tutHowTitle")}</h2>
    <ul class="tut-list">${["tutHow1", "tutHow2", "tutHow3", "tutHow4"].map(k => `<li>${t(k)}</li>`).join("")}</ul>`;
  else if (kind === "ai") body = `
    <div class="tut-hero">✨</div>
    <h2>${t("tutAiTitle")}</h2>
    <p>${t("tutAiText")}</p>
    ${aiSettingsHTML()}`;
  else body = `
    <div class="tut-hero">🎉</div>
    <h2>${t("tutDoneTitle")}</h2>
    <p>📱 ${t("tutDoneText")}</p>
    <p class="hint">⚙️ ${t("tutDoneText2")}</p>`;

  $("#modal").innerHTML = `
    <div class="tut-top">
      <div class="tut-dots">${TUT_STEPS.map((_, i) => `<i class="${i === tut.step ? "on" : i < tut.step ? "done" : ""}"></i>`).join("")}</div>
      ${last ? "" : `<button class="btn ghost small" data-tut="skipall">${t("tutSkipAll")} ✕</button>`}
    </div>
    ${body}
    <div class="actions tut-actions">
      ${tut.step > 0 ? `<button class="btn ghost small" data-tut="back">← ${t("tutBack")}</button>` : ""}
      <span class="tut-step">${t("tutStep", { a: tut.step + 1, b: TUT_STEPS.length })}</span>
      ${last ? `<button class="btn small" data-tut="finish">${t("tutStart")} →</button>`
             : `<button class="btn ghost small" data-tut="next">${t("tutSkip")}</button><button class="btn small" data-tut="next">${t("tutNext")} →</button>`}
    </div>`;
  $("#overlay").classList.add("open");
  bindAiSettings(() => openTutorial(tut.step));
}

function endTutorial() { tut.active = false; store.set("kb_onboarded", true); $("#overlay").classList.remove("open"); }

// ---------- Events ----------
$("#addForm").addEventListener("submit", e => {
  e.preventDefault();
  const val = $("#ingInput").value;
  val.split(/[,;]+/).map(resolve).filter(Boolean).forEach(id => pantry.add(id));
  $("#ingInput").value = "";
  render();
});
$("#pantry").addEventListener("click", e => { const id = e.target.dataset.rm; if (id) { pantry.delete(id); render(); } });
$("#groups").addEventListener("click", e => {
  const id = e.target.dataset.id; if (!id) return;
  pantry.has(id) ? pantry.delete(id) : pantry.add(id); render();
});
$("#clearBtn").addEventListener("click", () => { pantry.clear(); render(); });
$("#catSeg").addEventListener("click", e => { if (e.target.dataset.cat) { state.cat = e.target.dataset.cat; renderCats(); renderResults(); } });
$("#timeSel").addEventListener("change", e => { state.maxTime = +e.target.value; renderResults(); });
$("#diffSel").addEventListener("change", e => { state.diff = +e.target.value; renderResults(); });
$("#landSel").addEventListener("change", e => { state.land = e.target.value; renderResults(); });
$("#showAll").addEventListener("change", e => { state.showAll = e.target.checked; renderResults(); });
$("#searchInput").addEventListener("input", e => { state.q = e.target.value; scheduleNetQ(); renderResults(); });
$("#searchInput").addEventListener("keydown", e => { if (e.key === "Enter") e.target.blur(); });
$("#results").addEventListener("click", e => {
  const a = e.target.closest("[data-ai]");
  if (a) {
    if (a.dataset.ai === "settings") openSettings();
    else runAI(a.dataset.ai === "more");
    return;
  }
  const n = e.target.closest("[data-net]"); if (n) { openNetMeal(n.dataset.net); return; }
  const c = e.target.closest("[data-open]"); if (c) openRecipe(c.dataset.open);
});
$("#ownBtn").addEventListener("click", openOwnForm);
$("#camBtn").addEventListener("click", () => {
  if (!aiKey()) { toast(t("camNeedKey")); openSettings(); return; }
  if (!AI_PROVIDERS[aiProvider()].vision) { toast(t("aiNoVision", { p: AI_PROVIDERS[aiProvider()].name })); openSettings(); return; }
  $("#camInput").value = ""; $("#camInput").click();
});
$("#camInput").addEventListener("change", e => { const f = e.target.files && e.target.files[0]; if (f) scanPhoto(f); });
$("#settingsBtn").addEventListener("click", openSettings);
$("#jumpBtn").addEventListener("click", () => document.querySelector("main").scrollIntoView({ behavior: "smooth" }));
$("#randomBtn").addEventListener("click", () => {
  const all = allRecipes().map(r => ({ r, ev: evaluate(r) }));
  const pool = pantry.size ? all.filter(x => !x.ev.missing.length) : all;
  const pick = (pool.length ? pool : all)[Math.floor(Math.random() * (pool.length || all.length))];
  openRecipe(pick.r.id);
});
$("#overlay").addEventListener("click", e => {
  const btn = e.target.closest("button");
  if (e.target.id === "overlay" || (btn && btn.hasAttribute("data-close"))) closeModal();
  if (!btn) return;
  if (btn.dataset.copy) {
    const txt = btn.dataset.copy;
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast(t("copied")), () => toast(t("missingList", { x: txt })));
  }
  if (btn.dataset.del) {
    own.splice(+btn.dataset.del.slice(1), 1); store.set("kb_own", own);
    closeModal(); renderLands(); renderResults(); toast(t("deleted"));
  }
  if (btn.dataset.themeOpt) {
    store.set("kb_theme", btn.dataset.themeOpt); applyTheme(btn.dataset.themeOpt);
    document.querySelectorAll("[data-theme-opt]").forEach(b => b.classList.toggle("on", b === btn));
  }
  if (btn.dataset.lang) setLang(btn.dataset.lang);
  if (btn.dataset.tutLang) { switchLang(btn.dataset.tutLang); openTutorial(tut.step); }
  if (btn.dataset.tut) {
    const a = btn.dataset.tut;
    if (a === "next") openTutorial(tut.step + 1);
    else if (a === "back") openTutorial(tut.step - 1);
    else endTutorial(); // skipall / finish
  }
  if (btn.dataset.tutRestart) openTutorial(0);
  if (btn.dataset.scan) {
    const it = scan.items[+btn.dataset.scan];
    if (it) { it.on = !it.on; renderScanResult(scan.dataUrl); }
  }
  if (btn.dataset.scanAdd) {
    const add = scan.items.filter(x => x.on);
    add.forEach(x => pantry.add(x.id));
    closeModal(); render(); toast(t("camAdded", { n: add.length }));
  }
  if (btn.dataset.aiRemove || btn.dataset.aiProv) {
    if (btn.dataset.aiRemove) setAiKey("");
    else store.set("kb_ai_provider", btn.dataset.aiProv);
    resetAI();
    tut.active ? openTutorial(tut.step) : openSettings();
    scheduleAI(); renderResults();
  }
  if (btn.dataset.saveAi) {
    const r = ai.recipes.find(x => x.id === btn.dataset.saveAi);
    if (r) {
      own.push({ emoji: r.emoji, name: r.name, cat: r.cat, time: r.time, diff: r.diff, land: r.land || OWN_LAND,
        req: r.req, opt: r.opt, steps: r.steps });
      store.set("kb_own", own);
      closeModal(); renderLands(); renderResults(); toast(t("aiSaved"));
    }
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

applyTheme(store.get("kb_theme", "system"));
renderAll();
if (!store.get("kb_onboarded", false)) openTutorial(0);

// Offline-Modus (nur wenn über http/https geöffnet)
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
